# cloud-config
# See https://jonathanbossenger.com/2022/05/25/configuring-ubuntu-in-multipass-for-local-web-development-on-a-macbook/
packages:
  - software-properties-common
  - unzip
  - zip
  - golang-go
runcmd:
  # Setting the hostname
  - echo "Setting the hostname"
  - echo "wp-local-env" > /etc/hostname
  - hostname -F /etc/hostname
  # Installing multipass-sshfs (needed for mounting)
  - snap install multipass-sshfs
  # Adding required repositories
  - echo "Adding repositories"
  - add-apt-repository --no-update universe
  - add-apt-repository --no-update -y ppa:ondrej/php -y
  - add-apt-repository --no-update -y ppa:ondrej/apache2 -y
  - apt update
  - apt upgrade -y
  # Set up Apache
  - echo "Installing Apache"
  - apt install apache2 -y
  # Set up PHP (latest version, 8.4 as of October 2025)
  - echo "Installing PHP"
  - apt install php libapache2-mod-php php-mysql php-common php-xml php-xmlrpc php-curl php-gd php-imagick php-cli php-dev php-imap php-mbstring php-soap php-zip -y
  # Enable Apache modules
  - a2enmod ssl rewrite
  - echo "Installing Legacy PHP"
  # Install FastCGI Mod
  - apt install libapache2-mod-fcgid
  - a2enmod actions alias proxy_fcgi fcgid
  # Set up PHP 8.3 using FastCGI
  - apt install php8.3 php8.3-fpm php8.3-mysql php8.3-common php8.3-xml php8.3-xmlrpc php8.3-curl php8.3-gd php8.3-imagick php8.3-mbstring php8.3-soap php8.3-zip -y
  - sudo systemctl start php8.3-fpm
  # Set up PHP 8.2 using FastCGI
  - apt install php8.2 php8.2-fpm php8.2-mysql php8.2-common php8.2-xml php8.2-xmlrpc php8.2-curl php8.2-gd php8.2-imagick php8.2-mbstring php8.2-soap php8.2-zip -y
  - sudo systemctl start php8.2-fpm
  # Set up PHP 8.1 using FastCGI
  - apt install php8.1 php8.1-fpm php8.1-mysql php8.1-common php8.1-xml php8.1-xmlrpc php8.1-curl php8.1-gd php8.1-imagick php8.1-mbstring php8.1-soap php8.1-zip -y
  - sudo systemctl start php8.1-fpm
  # Set up MySQL
  - echo "Installing MySQL"
  - apt install mysql-server -y
  - mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'password';"
  - mysql -uroot -ppassword -e "FLUSH PRIVILEGES;"
  # Configure Apache
  - echo "Configuring Apache"
  - sed -i s/"export APACHE_RUN_USER=www-data"/"export APACHE_RUN_USER=ubuntu"/g /etc/apache2/envvars
  - sed -i s/"export APACHE_RUN_GROUP=www-data"/"export APACHE_RUN_GROUP=ubuntu"/g /etc/apache2/envvars
  - sed -i s/"index.html"/"index.php index.html"/g /etc/apache2/mods-enabled/dir.conf
  - echo "Configuring PHP.ini"
  - touch /etc/php/8.4/apache2/conf.d/user.ini
  - echo "display_errors=On" >> /etc/php/8.4/apache2/conf.d/user.ini
  - echo "memory_limit=128M" >> /etc/php/8.4/apache2/conf.d/user.ini
  - echo "upload_max_filesize=128M" >> /etc/php/8.4/apache2/conf.d/user.ini
  - echo "post_max_size=1024M" >> /etc/php/8.4/apache2/conf.d/user.ini
  - echo "max_execution_time=360" >> /etc/php/8.4/apache2/conf.d/user.ini
  - echo "max_input_time=360" >> /etc/php/8.4/apache2/conf.d/user.ini
  - echo "extension=soap" >> /etc/php/8.4/apache2/conf.d/user.ini
  - chown ubuntu:ubuntu /etc/php/8.4/apache2/conf.d/user.ini
  - # Configure PHP.ini for 8.3
  - touch /etc/php/8.3/fpm/conf.d/user.ini
  - echo "display_errors=On" >> /etc/php/8.3/fpm/conf.d/user.ini
  - echo "memory_limit=128M" >> /etc/php/8.3/fpm/conf.d/user.ini
  - echo "upload_max_filesize=128M" >> /etc/php/8.3/fpm/conf.d/user.ini
  - echo "post_max_size=1024M" >> /etc/php/8.3/fpm/conf.d/user.ini
  - echo "max_execution_time=360" >> /etc/php/8.3/fpm/conf.d/user.ini
  - echo "max_input_time=360" >> /etc/php/8.3/fpm/conf.d/user.ini
  - echo "extension=soap" >> /etc/php/8.3/fpm/conf.d/user.ini
  - chown ubuntu:ubuntu /etc/php/8.3/fpm/conf.d/user.ini
  - sed -i s/"user = www-data"/"user = ubuntu"/g /etc/php/8.3/fpm/pool.d/www.conf
  - sed -i s/"group = www-data"/"group = ubuntu"/g /etc/php/8.3/fpm/pool.d/www.conf
  - service php8.3-fpm restart
  - # Configure PHP.ini for 8.2
  - touch /etc/php/8.2/fpm/conf.d/user.ini
  - echo "display_errors=On" >> /etc/php/8.2/fpm/conf.d/user.ini
  - echo "memory_limit=128M" >> /etc/php/8.2/fpm/conf.d/user.ini
  - echo "upload_max_filesize=128M" >> /etc/php/8.2/fpm/conf.d/user.ini
  - echo "post_max_size=1024M" >> /etc/php/8.2/fpm/conf.d/user.ini
  - echo "max_execution_time=360" >> /etc/php/8.2/fpm/conf.d/user.ini
  - echo "max_input_time=360" >> /etc/php/8.2/fpm/conf.d/user.ini
  - echo "extension=soap" >> /etc/php/8.2/fpm/conf.d/user.ini
  - chown ubuntu:ubuntu /etc/php/8.2/fpm/conf.d/user.ini
  - sed -i s/"user = www-data"/"user = ubuntu"/g /etc/php/8.2/fpm/pool.d/www.conf
  - sed -i s/"group = www-data"/"group = ubuntu"/g /etc/php/8.2/fpm/pool.d/www.conf
  - service php8.2-fpm restart
  - # Configure PHP.ini for 8.1
  - touch /etc/php/8.1/fpm/conf.d/user.ini
  - echo "display_errors=On" >> /etc/php/8.1/fpm/conf.d/user.ini
  - echo "memory_limit=128M" >> /etc/php/8.1/fpm/conf.d/user.ini
  - echo "upload_max_filesize=128M" >> /etc/php/8.1/fpm/conf.d/user.ini
  - echo "post_max_size=1024M" >> /etc/php/8.1/fpm/conf.d/user.ini
  - echo "max_execution_time=360" >> /etc/php/8.1/fpm/conf.d/user.ini
  - echo "max_input_time=360" >> /etc/php/8.1/fpm/conf.d/user.ini
  - echo "extension=soap" >> /etc/php/8.1/fpm/conf.d/user.ini
  - chown ubuntu:ubuntu /etc/php/8.1/fpm/conf.d/user.ini
  - sed -i s/"user = www-data"/"user = ubuntu"/g /etc/php/8.1/fpm/pool.d/www.conf
  - sed -i s/"group = www-data"/"group = ubuntu"/g /etc/php/8.1/fpm/pool.d/www.conf
  - service php8.1-fpm restart
  # Create directory to save phpmyadmin data
  - mkdir /run/phpmyadmin
  # PHPMyAdmin
  - echo "Installing PHPMyAdmin"
  - export DEBIAN_FRONTEND=noninteractive
  - echo "phpmyadmin phpmyadmin/dbconfig-install boolean true" | debconf-set-selections
  - echo "phpmyadmin phpmyadmin/app-password-confirm password password" | debconf-set-selections
  - echo "phpmyadmin phpmyadmin/mysql/admin-pass password password" | debconf-set-selections
  - echo "phpmyadmin phpmyadmin/mysql/app-pass password password" | debconf-set-selections
  - echo "phpmyadmin phpmyadmin/reconfigure-webserver multiselect apache2" | debconf-set-selections
  - apt install -y phpmyadmin
  - wget https://www.phpmyadmin.net/downloads/phpMyAdmin-latest-all-languages.zip -O /run/phpmyadmin/phpmyadmin.zip
  - unzip /run/phpmyadmin/phpmyadmin.zip -d /run/phpmyadmin/
  - mv /usr/share/phpmyadmin/ /usr/share/_phpmyadmin/
  - mv /run/phpmyadmin/phpMyAdmin-*-all-languages/ /usr/share/phpmyadmin/
  # WP-CLI
  - curl -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
  - chmod +x wp-cli.phar
  - mv wp-cli.phar /usr/local/bin/wp
